<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookies</title>
  </head>
  <body>
    <div id="loginForm">
      <h2>Login to the website</h2>
      <input type="text" id="firstname" placeholder="Firstname" />
      <input type="text" id="email" placeholder="Email" />
      <button onclick="setCookies()">Log me in</button>
    </div>

    <script>
      function setCookies() {
        const firstname = document.getElementById("firstname").value;
        const email = document.getElementById("email").value;
        const expirationDate = new Date();

        expirationDate.setDate(expirationDate.getDate() + 10);
        document.cookie = `firstname=${firstname}; expires=${expirationDate.toUTCString()}; path=/`;
        document.cookie = `email=${email}; expires=${expirationDate.toUTCString()}; path=/`;
        showWelcomeMessageOrForm();
      }

      function getCookie(name) {
        const cookies = document.cookie.split("; ");

        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].split("=");

          if (cookie[0] === name) {
            return cookie[1];
          }
        }

        return "";
      }

      function showForm() {
        const welcomeMessage = document.getElementById("welcomeMessage");

        if (welcomeMessage) {
          welcomeMessage.remove();
        }

        document.getElementById("loginForm").style.display = "block";
      }

      function hideForm() {
        document.getElementById("loginForm").style.display = "none";
      }

      function deleteCookiesAndShowForm() {
        document.cookie = "firstname=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";
        document.cookie = "email=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";
        showForm();
      }

      function showWelcomeMessageOrForm() {
        const firstname = getCookie("firstname");

        if (!firstname) {
          showForm();
          return;
        }

        hideForm();

        const existingWelcomeMessage = document.getElementById("welcomeMessage");

        if (existingWelcomeMessage) {
          existingWelcomeMessage.remove();
        }

        const welcomeMessage = document.createElement("h1");
        const logoutLink = document.createElement("a");

        welcomeMessage.id = "welcomeMessage";
        welcomeMessage.append(`Welcome: ${firstname} `);
        logoutLink.href = "#";
        logoutLink.textContent = "(logout)";
        logoutLink.style.fontWeight = "normal";
        logoutLink.style.fontStyle = "italic";
        logoutLink.style.marginLeft = "10px";
        logoutLink.onclick = function (event) {
          event.preventDefault();
          deleteCookiesAndShowForm();
        };
        welcomeMessage.appendChild(logoutLink);
        document.body.appendChild(welcomeMessage);
      }

      showWelcomeMessageOrForm();
    </script>
  </body>
</html>
